[project]
name = "healthathon-api"
version = "0.1.0"
description = "API for the clinician surfaces and the patient app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    # Crops regimen item lines out of their page, and crops each detected
    # region out of an uploaded page.
    "pillow>=10",
    # Talks to the document agent's model provider.
    "httpx>=0.27",
    # Multipart form parsing: an upload carries its photograph.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The text detector. Heavy (paddlepaddle is a few hundred MB), and needed
# only to read a real photograph: the tests run against a fake detector,
# so neither CI nor `uv sync` pulls this in.
ocr = [
    "paddleocr>=3.7",
    "paddlepaddle>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthathon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["healthathon", "dev_seed"]

[tool.mypy]
strict = true
packages = ["healthathon"]
mypy_path = "src"

# paddleocr ships no stubs, and it is an optional install: without the
# "ocr" extra the import is missing entirely, with it the module is
# untyped. One override covers both, where an inline ignore cannot.
[[tool.mypy.overrides]]
module = ["paddleocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
