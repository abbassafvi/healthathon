# Local development database. PostgreSQL 16, as the schema requires.
# The schema is loaded on first start from db/schema.sql.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthathon
      POSTGRES_USER: healthathon
      POSTGRES_PASSWORD: healthathon
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "healthathon", "-d", "healthathon"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
